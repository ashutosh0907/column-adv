<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Hour cylindrical room speaker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0e8db"/>
      <stop offset="1" stop-color="#e1d2bc"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#312e2a"/>
      <stop offset=".45" stop-color="#4c4740"/>
      <stop offset="1" stop-color="#2c2925"/>
    </linearGradient>
    <pattern id="mesh" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.5" fill="#8b8274"/>
    </pattern>
    <clipPath id="bodyClip">
      <rect x="286" y="140" width="228" height="336" rx="114"/>
    </clipPath>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="208" fill="#fffdf9" opacity=".3"/>
  <ellipse cx="400" cy="500" rx="158" ry="22" fill="#2c2419" opacity=".13"/>
  <rect x="286" y="140" width="228" height="336" rx="114" fill="url(#body)"/>
  <g clip-path="url(#bodyClip)">
    <rect x="286" y="140" width="228" height="336" fill="url(#mesh)" opacity=".55"/>
    <ellipse cx="400" cy="148" rx="114" ry="26" fill="#5a544b" opacity=".6"/>
    <rect x="286" y="340" width="228" height="2" fill="#161512" opacity=".55"/>
  </g>
  <ellipse cx="400" cy="158" rx="88" ry="16" fill="#3a3630" opacity=".55"/>
  <circle cx="400" cy="164" r="9" fill="#c98a5b"/>
  <rect x="378" y="404" width="44" height="4" rx="2" fill="#c9c1b3" opacity=".45"/>
</svg>
